name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish'
        required: true
        default: 'v0.1.2'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute release tag
        id: tag
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            "tag=${{ github.event.inputs.tag }}" | Add-Content -Path $env:GITHUB_OUTPUT
          } else {
            "tag=$($env:GITHUB_REF -replace '^refs/tags/', '')" | Add-Content -Path $env:GITHUB_OUTPUT
          }

      - name: Build app (Windows)
        run: npm run package

      - name: Check packaged files after build
        run: |
          if (!(Test-Path out/release)) {
            Write-Error "Directory out/release not found."
          }
          Get-ChildItem -Recurse out/release | ForEach-Object { Write-Output $_.FullName }

      - name: Zip Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path "out/release/*" -DestinationPath "SQLExplorer-Windows-${{ steps.tag.outputs.tag }}.zip" -Force

      - name: Create release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: SQLExplorer ${{ steps.tag.outputs.tag }}
          files: SQLExplorer-Windows-${{ steps.tag.outputs.tag }}.zip
          fail_on_unmatched_files: false
          overwrite_files: true
          append_body: true
          generate_release_notes: true
